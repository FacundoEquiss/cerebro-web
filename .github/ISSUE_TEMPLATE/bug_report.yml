name: Bug report
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Do not paste secrets, keys or customer data.**
        For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Storefront, Checkout / orders, Payments, Admin panel, Data adapters, SEO / feeds, Measurement, The brain, Docs, Other]
    validations:
      required: true
  - type: input
    id: adapters
    attributes:
      label: Adapters in use
      description: DATA_SOURCE and PAYMENT_PROVIDER (names only).
      placeholder: json + manual
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Version or commit, Node version, where it runs, browser and device.
      placeholder: v0.1.0 · Node 22 · Docker · Safari on a phone
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server log lines or a screenshot, with personal data removed.
